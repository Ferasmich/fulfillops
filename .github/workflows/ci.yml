name: FulfillOps CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked main-branch image to GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
        env:
          POSTGRES_DB: fulfillops_test_ci
          POSTGRES_USER: fulfillops
          POSTGRES_PASSWORD: ci-owner-disposable
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U fulfillops -d fulfillops_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '5433'
      POSTGRES_DB: fulfillops_test_ci
      POSTGRES_USER: fulfillops
      POSTGRES_PASSWORD: ci-owner-disposable
      API_DB_PASSWORD: ci-api-disposable
      WORKER_DB_PASSWORD: ci-worker-disposable
      FULFILLOPS_EVIDENCE_DIR: evid/06-ci/worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/development.txt
      - name: Install pinned development packages
        run: python -m pip install -r requirements/development.txt
      - name: Prepare fresh evidence in the disposable runner
        run: |
          python - <<'PYCODE'
          import shutil
          from pathlib import Path
          output = Path('evid/06-ci')
          if output.exists():
              shutil.rmtree(output)
          output.mkdir(parents=True)
          for name in ('regression-failing.txt', 'regression-fixed.txt'):
              (Path('evid/04-tests') / name).unlink(missing_ok=True)
          PYCODE
      - name: Validate workflow
        run: >-
          docker run --rm --network none
          -v "$PWD/.github/workflows:/work:ro"
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          -shellcheck= -pyflakes= /work/ci.yml
      - name: Lint and formatting
        run: |
          ruff check api common db worker tests scripts
          ruff format --check api common db worker tests scripts
      - name: Owned tests and worker/checker drills
        run: python -m pytest -v --junitxml=evid/06-ci/tests.xml
      - name: Reproduce deliberate regression and repair
        run: python scripts/regression_demo.py
      - name: Build image
        run: docker build --tag "fulfillops:${GITHUB_SHA}" .
      - name: Black-box check of built image
        env:
          FULFILLOPS_IMAGE: fulfillops:${{ github.sha }}
        run: python -m scripts.ci_stack
      - name: SBOM, OS/library vulnerabilities and enforced security policy
        run: python -m scripts.scan_image --image "fulfillops:${GITHUB_SHA}" --output evid/06-ci
      - name: Save accepted image for exact promotion
        run: |
          mkdir -p "$RUNNER_TEMP/accepted-image"
          docker save "fulfillops:${GITHUB_SHA}" -o "$RUNNER_TEMP/accepted-image/image.tar"
          cp evid/06-ci/image-metadata.json "$RUNNER_TEMP/accepted-image/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accepted-image-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/accepted-image/
          retention-days: 7
          compression-level: 1
          if-no-files-found: error
      - name: Upload test, SBOM and scan evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evid/06-ci/
            evid/04-tests/regression-failing.txt
            evid/04-tests/regression-fixed.txt
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: approved-image-promotion
    needs: quality
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: accepted-image-${{ github.sha }}-${{ github.run_attempt }}
          path: accepted-image
      - name: Verify accepted image identity
        run: |
          docker load -i accepted-image/image.tar
          python - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          metadata = json.loads(Path('accepted-image/image-metadata.json').read_text())
          assert metadata['source_commit'] == os.environ['GITHUB_SHA'], 'Source commit mismatch'
          expected = metadata['image_id']
          actual = subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{.Id}}', 'fulfillops:' + os.environ['GITHUB_SHA']], text=True).strip()
          assert actual == expected, 'Accepted image identity mismatch'
          PYCODE
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish SHA tag and record digest
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${repository}:${GITHUB_SHA}"
          docker tag "fulfillops:${GITHUB_SHA}" "$tag"
          if docker manifest inspect "$tag" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing SHA tag" >&2
            exit 1
          fi
          docker push "$tag"
          mkdir -p evid/06-ci/release
          docker image inspect --format '{{json .RepoDigests}}' "$tag" > evid/06-ci/release/registry-digests.json
          printf '%s\n' "$tag" > evid/06-ci/release/image-tag.txt
          printf 'Published checked image: `%s`\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: evid/06-ci/release/
          if-no-files-found: error
