apiVersion: batch/v1
kind: Job
metadata:
  name: fulfillops-bootstrap
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: fulfillops-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: fulfillops:d9a144cca067221ef8f02e3d652548cc85dcf0e4
          imagePullPolicy: Never
          command: [python, -m, db.bootstrap]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: fulfillops-config
          env:
            - name: POSTGRES_USER
              value: fulfillops
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fulfillops-db-credentials
                  key: owner-password
            - name: API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fulfillops-db-credentials
                  key: api-password
            - name: WORKER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fulfillops-db-credentials
                  key: worker-password
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
