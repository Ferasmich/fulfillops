apiVersion: v1
kind: Service
metadata:
  name: db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  clusterIP: None
  selector:
    app: fulfillops-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: fulfillops-api
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selector:
    app: fulfillops-api
  ports:
    - port: 80
      targetPort: 8080
