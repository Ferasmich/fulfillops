apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fulfillops
  namespace: argocd
spec:
  description: Local FulfillOps lab only
  sourceRepos:
    - https://github.com/Ferasmich/fulfillops.git
  destinations:
    - namespace: fulfillops
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
