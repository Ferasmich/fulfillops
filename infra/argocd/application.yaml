apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fulfillops
  namespace: argocd
spec:
  project: fulfillops
  source:
    repoURL: https://github.com/Ferasmich/fulfillops.git
    targetRevision: main
    path: infra/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: fulfillops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 30s
