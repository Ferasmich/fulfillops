x-app: &app
  image: ${FULFILLOPS_IMAGE:-fulfillops:local}
  build:
    context: .
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-connection: &connection
  DB_HOST: db
  DB_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
  APP_ENV: ${APP_ENV:-test}

services:
  db:
    image: postgres:16@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  init:
    <<: *app
    command: [python, -m, db.bootstrap]
    environment:
      <<: *connection
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *connection
      POSTGRES_USER: fulfillops_api
      POSTGRES_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: [python, -m, worker.main]
    environment:
      <<: *connection
      POSTGRES_USER: fulfillops_worker
      POSTGRES_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD in .env}
    depends_on:
      init:
        condition: service_completed_successfully
    deploy:
      replicas: 2
    healthcheck:
      test: [CMD, python, -m, worker.health]
      interval: 5s
      timeout: 4s
      retries: 5

volumes:
  postgres_data:
